[project]
name = "home-assistant-power-sync"
version = "2.12.1329"
description = "Home Assistant energy management and battery optimization integration"
requires-python = ">=3.14.2"
dependencies = []

[project.optional-dependencies]
test = [
    "aemo-to-tariff>=0.7.15",
    "aiohttp>=3.9",
    "cryptography>=42",
    "goodwe>=0.4.9",
    "highspy>=1.7.0",
    "protobuf>=4.25.0",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "tesla-protocol>=1.3.1",
    "tzdata>=2026.1",
]

[dependency-groups]
dev = [
    "homeassistant>=2026.9.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
ignore = ["N999"]
