---
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: ["--select=E9,F63,F7,F82"]
        stages: [manual]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        args: [--check, --quiet, --target-version=py312]
        files: ^((custom_components|tests)/.+)?[^/]+\.py$
        stages: [manual]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=additionals,alle,alot,bund,currenty,datas,farenheit,falsy,fo,haa,hass,iif,incomfort,ines,ist,nam,nd,pres,pullrequests,resset,rime,ser,serie,te,technik,ue,unsecure,withing,zar
          - --skip=./.*,*.csv,*.json,*.ambr
          - --quiet-level=2
        exclude_types: [csv, json]
        exclude: ^tests/fixtures/|homeassistant/generated/
        stages: [manual]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
        stages: [manual]
      - id: check-json
        exclude: (.vscode|.devcontainer)
      - id: check-toml
      - id: check-yaml
        files: ^(\.github/workflows/(tests|security|validate)\.yml|\.pre-commit-config\.yaml)$
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^\.github/FUNDING\.yml$
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [--branch=dev, --branch=master, --branch=rc]
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-d, "{extends: default, rules: {document-start: disable, line-length: disable, truthy: disable}}"]
        files: ^(\.github/workflows/(tests|security|validate)\.yml|\.pre-commit-config\.yaml)$
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        stages: [manual]
  - repo: https://github.com/cdce8p/python-typing-update
    rev: v0.8.1
    hooks:
      - id: python-typing-update
        stages: [manual]
        args: [--py312-plus, --force, --keep-updates]
        files: ^(custom_components|tests)/.+\.py$
  - repo: https://github.com/mongodb/kingfisher
    rev: v2.0.0
    hooks:
      - id: kingfisher-auto
        stages: [pre-commit]
